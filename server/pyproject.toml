readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.12.2",
    "black>=25.12.0",
    "celery==5.3.4",
    "django==4.2.7",
    "django-cors-headers==4.3.1",
    "django-filter>=25.1",
    "django-ratelimit>=4.1.0",
    "django-redis>=6.0.0",
    "djangorestframework==3.14.0",
    "jieba==0.42.1",
    "openai==1.3.0",
