    "pymysql>=1.1.2",
    "python-dotenv==1.0.0",
    "redis==5.0.1",
    "requests==2.31.0",
]

[tool.setuptools.packages.find]
include = ["core", "app", "paper"]  # 只包含实际的 Python 包
